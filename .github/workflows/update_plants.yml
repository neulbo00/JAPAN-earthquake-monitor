name: 원전 가동 현황 수집 (일일 갱신)

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 자정 (UTC) 실행 (한국 시간 오전 9시)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  update-plants:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 원전 현황 데이터 갱신
        run: python update_plants.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plants.json
          git diff --staged --quiet || git commit -m "chore: 원전 가동 현황 갱신 $(date -u +'%Y-%m-%d')"
          git push
